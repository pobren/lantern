# Checks JMAP Connect's sign in and mail calls against real Stalwart and Cyrus servers (in Docker, on Linux, so
# it's cheap), and that the hosted providers' session addresses answer and ask for a password.
name: JMAP servers

on:
  push:
    branches: ["claude/project-thread-z1fj2h"]
    paths: ["apps/Lantern/JMAP.swift", "apps/Shared/**", "tests/jmap-servers/**", ".github/workflows/jmap-servers.yml"]
  workflow_dispatch:

jobs:
  servers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stalwart and Cyrus
        run: bash tests/jmap-servers/run.sh
      - name: Hosted providers answer at the addresses the app uses
        run: |
          for u in https://my.mailbux.com/jmap/session https://mail.thundermail.com/.well-known/jmap; do
            echo "== $u"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -m 20 "$u" || true
            curl -s -I -m 20 "$u" | grep -i -E "^(www-authenticate|location|server):" || true
          done
      - name: Mailbux and Thundermail with real accounts (once Paul adds their secrets)
        env:
          MAILBUX_USER: ${{ secrets.MAILBUX_USER }}
          MAILBUX_PASSWORD: ${{ secrets.MAILBUX_PASSWORD }}
          THUNDERMAIL_USER: ${{ secrets.THUNDERMAIL_USER }}
          THUNDERMAIL_APP_PASSWORD: ${{ secrets.THUNDERMAIL_APP_PASSWORD }}
        run: |
          ok=0
          if [ -n "$MAILBUX_USER" ]; then
            echo "== Mailbux"; python3 -I tests/jmap-servers/smoke.py https://my.mailbux.com/jmap/session "$MAILBUX_USER" "$MAILBUX_PASSWORD" || ok=1
          else echo "Mailbux secrets not added yet"; fi
          if [ -n "$THUNDERMAIL_USER" ]; then
            echo "== Thundermail"; python3 -I tests/jmap-servers/smoke.py https://mail.thundermail.com/.well-known/jmap "$THUNDERMAIL_USER" "$THUNDERMAIL_APP_PASSWORD" || ok=1
          else echo "Thundermail secrets not added yet"; fi
          exit $ok
