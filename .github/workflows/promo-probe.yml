# Promo video, step 0: checks whether a GitHub Mac can record its own screen as video.
name: Promo probe
on:
  push:
    branches: [claude/project-thread-fttuy9]
    paths: [".github/workflows/promo-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Grant Screen Recording
        continue-on-error: true
        run: |
          now=$(date +%s)
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            [ -f "$db" ] || continue
            for client in /usr/sbin/screencapture /bin/bash /bin/zsh /bin/sh /usr/bin/env "$(command -v bash)"; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now);" && echo "granted $client" || true
            done
          done
          for p in $(ps -axo comm | grep -iE "runner|provisioner" | sort -u); do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$p',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now);" && echo "granted $p" || true
          done
      - name: Record
        continue-on-error: true
        run: |
          mkdir -p promo/probe
          system_profiler SPDisplaysDataType | grep -iE "resolution|display" > promo/probe/sc.log || true
          open -a TextEdit; open -a Calculator; sleep 3
          (screencapture -v -V 5 -k promo/probe/screen.mov >> promo/probe/sc.log 2>&1; echo "exit $?" >> promo/probe/sc.log) &
          sleep 1; osascript -e 'tell application "Calculator" to activate' || true
          sleep 2; osascript -e 'tell application "TextEdit" to activate' || true
          wait
          screencapture -x promo/probe/still.png 2>>promo/probe/sc.log || true
          which ffmpeg >> promo/probe/sc.log 2>&1 || echo "no ffmpeg" >> promo/probe/sc.log
          xcrun simctl list runtimes >> promo/probe/sc.log 2>&1
          ls /Applications | grep -i xcode >> promo/probe/sc.log
          ls -la promo/probe; cat promo/probe/sc.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -f promo/probe
          git commit -m "Promo probe results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
