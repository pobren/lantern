# Takes the App Store screenshots from sample mail, so they never show anyone's real email.
# It runs when a commit message contains [screens], or by hand from the Actions tab. It builds the app for the
# iPhone and iPad simulators and for the Mac (no signing needed), opens each screen with -JCDemo -JCScreen,
# captures it, adds a caption at Apple's sizes and commits the results to apps/screenshots/store/.
name: Screenshots

on:
  push:
    paths: ["apps/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] || { echo "No Xcode 26 or newer on this Mac"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Make the Xcode project
        run: |
          if curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip && unzip -q /tmp/xcodegen.zip -d /tmp/xg; then
            /tmp/xg/xcodegen/bin/xcodegen generate
          else
            brew install xcodegen && xcodegen generate
          fi
      - name: Build for the simulators and the Mac
        run: |
          set -o pipefail
          xcodebuild build -project Lantern.xcodeproj -scheme Lantern -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= | tail -n 30
          xcodebuild build -project Lantern.xcodeproj -scheme Lantern -configuration Debug \
            -destination "generic/platform=macOS" -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO | tail -n 30
      - name: Shoot iPhone and iPad
        run: |
          APP=$(find build/ios -name "JMAP Connect.app" -path "*iphonesimulator*" | head -1)
          [ -n "$APP" ] || { echo "No simulator app built"; exit 1; }
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          TYPES=$(xcrun simctl list devicetypes -j)
          pick() { echo "$TYPES" | python3 -c "import json,sys,re; t=[x for x in json.load(sys.stdin)['devicetypes'] if re.search(sys.argv[1], x['name'])]; print(t[-1]['identifier'] if t else '')" "$1"; }
          IPHONE=$(pick 'iPhone 1[6-9] Pro Max')
          IPAD=$(pick 'iPad Pro 13-inch')
          echo "Runtime $RUNTIME, iPhone $IPHONE, iPad $IPAD"
          shoot() {
            local device=$1 type=$2; shift 2
            local udid
            udid=$(xcrun simctl create "Shots $device" "$type" "$RUNTIME")
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$udid" "$APP"
            mkdir -p "screenshots/raw/$device"
            local n=0
            for screen in "$@"; do
              n=$((n + 1))
              local mode=light arg=$screen
              if [ "$screen" = dark ]; then mode=dark; arg=email; fi
              xcrun simctl ui "$udid" appearance "$mode"
              xcrun simctl terminate "$udid" dev.paulobrien.lantern 2>/dev/null || true
              xcrun simctl launch "$udid" dev.paulobrien.lantern -JCDemo -JCScreen "$arg"
              sleep 8
              xcrun simctl io "$udid" screenshot "screenshots/raw/$device/$n-$screen.png"
            done
            xcrun simctl shutdown "$udid" || true
          }
          shoot iphone "$IPHONE" inbox email compose folders dark
          shoot ipad "$IPAD" email compose folders dark settings
      - name: Shoot the Mac
        run: |
          APP=$(find build/mac -name "JMAP Connect.app" -path "*Debug/*" -not -path "*iphonesimulator*" | head -1)
          [ -n "$APP" ] || { echo "No Mac app built"; exit 1; }
          mkdir -p screenshots/raw/mac
          cat > /tmp/winid.swift <<'SWIFT'
          import CoreGraphics
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          let mine = list.filter { ($0["kCGWindowOwnerName"] as? String) == "JMAP Connect" && ($0["kCGWindowLayer"] as? Int) == 0 }
          let biggest = mine.max { a, b in
            let w = { (d: [String: Any]) -> Double in let b = d["kCGWindowBounds"] as? [String: Double] ?? [:]; return (b["Width"] ?? 0) * (b["Height"] ?? 0) }
            return w(a) < w(b)
          }
          if let id = biggest?["kCGWindowNumber"] as? Int { print(id) }
          SWIFT
          n=0
          for screen in email compose settings dark; do
            n=$((n + 1))
            extra=()
            [ "$screen" = dark ] && extra=(-AppleInterfaceStyle Dark)
            arg=$screen; [ "$screen" = dark ] && arg=email
            pkill -x "JMAP Connect" 2>/dev/null || true
            sleep 1
            "$APP/Contents/MacOS/JMAP Connect" -JCDemo -JCScreen "$arg" "${extra[@]}" -NSQuitAlwaysKeepsWindows NO &
            sleep 10
            osascript -e 'tell application "JMAP Connect" to activate' 2>/dev/null || true
            sleep 2
            ID=$(swift /tmp/winid.swift 2>/dev/null || true)
            if [ -n "$ID" ]; then
              screencapture -o -x -l "$ID" "screenshots/raw/mac/$n-$screen.png"
            else
              echo "::warning::No window found for $screen, taking the whole screen"
              screencapture -x "screenshots/raw/mac/$n-$screen.png"
            fi
          done
          pkill -x "JMAP Connect" 2>/dev/null || true
      - name: Add captions at App Store sizes
        run: |
          python3 -m pip install --quiet pillow 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow
          rm -rf screenshots/store
          python3 screenshots/frame.py screenshots/raw screenshots/store
      - name: Keep the raw shots as a download too
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/screenshots
      - name: Commit the screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add screenshots/raw screenshots/store
          git commit -m "App Store screenshots from sample mail [skip ci]" || { echo "Nothing new"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
