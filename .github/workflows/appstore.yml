# Sends the App Store listing (text, screenshots, categories, price, review notes) to App Store Connect
# and attaches a build to the iPhone and iPad version and the Mac version. It never submits for review.
# Runs when a commit message contains [listing] or [listing 135] (135 = build to attach), or by hand from the Actions tab.
name: App Store listing

on:
  push:
    paths: ["apps/store/**", ".github/workflows/appstore.yml"]
  workflow_dispatch:
    inputs:
      build:
        description: "Build number to attach (leave empty to only update the listing)"
        required: false

jobs:
  listing:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[listing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - name: Fill in the listing
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ inputs.build }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$BUILD" ]; then BUILD=$(printf '%s' "$MSG" | grep -o '\[listing [0-9]*\]' | grep -o '[0-9]*' | head -1); fi
          echo "Build to attach: ${BUILD:-none}"
          BUILD="$BUILD" python3 apps/store/asc_listing.py
