# Lantern for Mac, iPhone and iPad, as an XcodeGen project. GitHub Actions runs `xcodegen` to make Lantern.xcodeproj
# and builds it on a Mac, so nobody needs Xcode to change it.
name: Lantern
options:
  bundleIdPrefix: dev.paulobrien
  # 40 languages from Shared/Localizable.xcstrings (made by i18n/build_catalog.py); English is the source.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2"   # send later, out of office, unsubscribe, contacts, Apple Watch (1.1 is build 149)
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Lantern:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Lantern
      - path: Shared
      # The Watch's small JMAP client also sends replies typed on iPhone alerts.
      - path: WatchShared/WatchMail.swift
    dependencies:
      # Instant alerts: shows the sender and subject (iPhone and iPad only; the Mac app hears about mail itself).
      - target: Notify
        destinationFilters: [iOS]
      # Home Screen and Lock Screen widgets (iPhone and iPad).
      - target: Widget
        destinationFilters: [iOS]
      # Apple Watch app (1.2), carried inside the iPhone app the way Xcode does it.
      - target: Watch
        destinationFilters: [iOS]
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: Lantern/Info.plist
      properties:
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.shared
        # Sign in with Fastmail: the OAuth client id (see oauth/README.md). Empty means the live one,
        # https://jmapconnect.app/oauth/client.json (live 20 Nov 2026, pob #582).
        JCOAuthClient: ""
        BGTaskSchedulerPermittedIdentifiers: [dev.paulobrien.lantern.refresh]
        UIBackgroundModes: [fetch]
        CFBundleName: JMAP Connect    # the name in the Mac menu bar and Finder
        # Emails still link pictures over plain http; let the email viewer (only) load them like any mail app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern
        PRODUCT_NAME: JMAP Connect
        PRODUCT_MODULE_NAME: Lantern
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JMAP Connect
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: © Paul O'Brien
        CODE_SIGN_ENTITLEMENTS: Lantern/Lantern-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Lantern/Lantern-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ENABLE_APP_SANDBOX: YES
        SUPPORTS_MACCATALYST: NO
  Notify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: JMAP Connect
        # Must match the app's own version and build number, or App Store Connect warns (ITMS-90473).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.shared
        # Must match the app's, so the extension can refresh a Fastmail sign in too.
        JCOAuthClient: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern.notify
        PRODUCT_NAME: Notify
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Notify/Notify.entitlements
        SKIP_INSTALL: YES
  Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/Localise.swift
      - path: Shared/Localizable.xcstrings
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: JMAP Connect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern.widget
        PRODUCT_NAME: MailWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: WatchShared
      - path: Shared/JMAPAuth.swift
      - path: Shared/Localise.swift
      - path: Shared/Localizable.xcstrings
    dependencies:
      - target: WatchWidget
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: JMAP Connect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.paulobrien.lantern
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern.watchkitapp
        PRODUCT_NAME: JMAPConnectWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
        SKIP_INSTALL: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  WatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
      - path: WatchShared
      - path: Shared/JMAPAuth.swift
      - path: Shared/Localise.swift
      - path: Shared/Localizable.xcstrings
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: JMAP Connect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.watch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern.watchkitapp.widget
        PRODUCT_NAME: WatchWidget
        CODE_SIGN_ENTITLEMENTS: WatchWidget/WatchWidget.entitlements
        SKIP_INSTALL: YES
schemes:
  Lantern:
    build:
      targets:
        Lantern: all
    run:
      config: Debug
    archive:
      config: Release
