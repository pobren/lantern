# Lantern for Mac, iPhone and iPad, as an XcodeGen project. GitHub Actions runs `xcodegen` to make Lantern.xcodeproj
# and builds it on a Mac, so nobody needs Xcode to change it.
name: Lantern
options:
  bundleIdPrefix: dev.paulobrien
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2"   # instant alerts test builds (1.0 is with Apple, 1.1 is offline mail)
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Lantern:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Lantern
      - path: Shared
    dependencies:
      # Instant alerts: shows the sender and subject (iPhone and iPad only; the Mac app hears about mail itself).
      - target: Notify
        platformFilters: [iOS]
    info:
      path: Lantern/Info.plist
      properties:
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.shared
        BGTaskSchedulerPermittedIdentifiers: [dev.paulobrien.lantern.refresh]
        UIBackgroundModes: [fetch]
        CFBundleName: JMAP Connect    # the name in the Mac menu bar and Finder
        # Emails still link pictures over plain http; let the email viewer (only) load them like any mail app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern
        PRODUCT_NAME: JMAP Connect
        PRODUCT_MODULE_NAME: Lantern
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JMAP Connect
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: © Paul O'Brien
        CODE_SIGN_ENTITLEMENTS: Lantern/Lantern-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Lantern/Lantern-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ENABLE_APP_SANDBOX: YES
        SUPPORTS_MACCATALYST: NO
  Notify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: JMAP Connect
        JCKeychainGroup: $(AppIdentifierPrefix)dev.paulobrien.lantern.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern.notify
        PRODUCT_NAME: Notify
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Notify/Notify.entitlements
        SKIP_INSTALL: YES
schemes:
  Lantern:
    build:
      targets:
        Lantern: all
    run:
      config: Debug
    archive:
      config: Release
