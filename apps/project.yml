# Lantern for Mac, as an XcodeGen project. GitHub Actions runs `xcodegen` to make Lantern.xcodeproj and builds it
# on a Mac, so nobody needs Xcode to change it.
name: Lantern
options:
  bundleIdPrefix: dev.paulobrien
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Lantern:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Lantern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paulobrien.lantern
        PRODUCT_NAME: Lantern
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lantern
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: © Paul O'Brien
        CODE_SIGN_ENTITLEMENTS: Lantern/Lantern.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
schemes:
  Lantern:
    build:
      targets:
        Lantern: all
    run:
      config: Debug
    archive:
      config: Release
